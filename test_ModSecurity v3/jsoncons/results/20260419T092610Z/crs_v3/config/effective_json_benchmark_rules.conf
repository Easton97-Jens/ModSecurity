SecRuleEngine On
SecRequestBodyAccess On
SecAuditEngine Off
SecDebugLog /dev/null
SecDebugLogLevel 0
SecRequestBodyLimit 8388608
SecRequestBodyNoFilesLimit 8388608
SecRequestBodyJsonDepthLimit 4096
SecRule REQUEST_HEADERS:Content-Type "^application/json$" "id:1001001,phase:1,t:none,t:lowercase,pass,nolog,ctl:requestBodyProcessor=JSON"

# --- CRS v3 includes added by benchmark test.sh ---
Include "/root/git3/ModSecurity3-jsoncons/test/benchmark/owasp-v3/crs-setup.conf.example"
Include "/root/git3/ModSecurity3-jsoncons/test/benchmark/owasp-v3/rules/*.conf"
