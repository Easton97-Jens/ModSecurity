name: Security Scan and Findings PR

on:
  push:
  pull_request:
  schedule:
    - cron: '20 14 * * 1'

permissions:
  contents: write
  pull-requests: write
  security-events: write

jobs:
  security-scan:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: c-cpp
          build-mode: autobuild

      - name: Autobuild
        uses: github/codeql-action/autobuild@v4

      - name: Analyze
        id: analyze
        uses: github/codeql-action/analyze@v4
        with:
          output: ../codeql-results

      - name: Evaluate findings
        id: findings
        shell: bash
        env:
          SARIF_DIR: ${{ steps.analyze.outputs.sarif-output }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import glob
          import json
          import os

          sarif_dir = os.environ["SARIF_DIR"]
          files = glob.glob(os.path.join(sarif_dir, "*.sarif"))
          total = 0
          for path in files:
              with open(path, "r", encoding="utf-8") as f:
                  data = json.load(f)
              for run in data.get("runs", []):
                  total += len(run.get("results", []))

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as out:
              out.write(f"count={total}\n")
              out.write(f"has_findings={'true' if total > 0 else 'false'}\n")
          PY

      - name: Prepare findings branch content
        if: steps.findings.outputs.has_findings == 'true' && github.event_name != 'pull_request'
        shell: bash
        env:
          SARIF_DIR: ${{ steps.analyze.outputs.sarif-output }}
          FINDINGS_COUNT: ${{ steps.findings.outputs.count }}
        run: |
          set -euo pipefail
          mkdir -p security-reports
          cp "$SARIF_DIR"/*.sarif security-reports/

          cat > security-reports/security-findings.md <<EOF
          # Security Scan Findings

          - Scanner: CodeQL
          - Findings: ${FINDINGS_COUNT}
          - Workflow run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}
          - Commit: ${GITHUB_SHA}
          EOF

      - name: Commit findings report
        id: commit_changes
        if: steps.findings.outputs.has_findings == 'true' && github.event_name != 'pull_request'
        shell: bash
        env:
          BRANCH_NAME: security/auto-fix
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git switch -C "$BRANCH_NAME"
          git add security-reports/

          if git diff --cached --quiet; then
            echo "committed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git commit -m "chore(security): update automated scan findings"
          git push --force-with-lease origin "$BRANCH_NAME"
          echo "committed=true" >> "$GITHUB_OUTPUT"

      - name: Create or update pull request
        if: steps.findings.outputs.has_findings == 'true' && github.event_name != 'pull_request'
        uses: actions/github-script@v9
        env:
          BRANCH_NAME: security/auto-fix
          BASE_BRANCH: ${{ github.event.repository.default_branch }}
          FINDINGS_COUNT: ${{ steps.findings.outputs.count }}
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const head = `${owner}:${process.env.BRANCH_NAME}`;
            const base = process.env.BASE_BRANCH;
            const title = "Security Scan Findings";
            const body = [
              "Automatisch erzeugter Security-Report.",
              "",
              `- Scanner: CodeQL`,
              `- Findings: ${process.env.FINDINGS_COUNT}`,
              `- Workflow-Run: ${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}`,
            ].join("\n");

            const existing = await github.rest.pulls.list({
              owner,
              repo,
              state: "open",
              head,
              base,
              per_page: 1,
            });

            if (existing.data.length > 0) {
              await github.rest.pulls.update({
                owner,
                repo,
                pull_number: existing.data[0].number,
                title,
                body,
              });
              core.info(`Updated PR #${existing.data[0].number}`);
            } else {
              const created = await github.rest.pulls.create({
                owner,
                repo,
                title,
                head: process.env.BRANCH_NAME,
                base,
                body,
              });
              core.info(`Created PR #${created.data.number}`);
            }
