name: "Security Scan and Auto PR"

on:
  push:
  pull_request:
  schedule:
    # Weekly scan (UTC)
    - cron: "20 2 * * 1"

jobs:
  codeql-scan:
    name: CodeQL scan (c-cpp)
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: c-cpp
          build-mode: autobuild

      - name: Autobuild
        uses: github/codeql-action/autobuild@v4

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4

  create-security-pr:
    name: Create/Update PR with findings report
    runs-on: ubuntu-latest
    needs: codeql-scan
    # Avoid creating PRs from PR events
    if: ${{ github.event_name != 'pull_request' }}

    permissions:
      contents: write
      pull-requests: write
      security-events: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Collect open CodeQL alerts
        id: findings
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          REF_NAME: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p security
          alerts_json="security/codeql-alerts.json"

          # Code scanning alerts can appear with short delay after analysis upload.
          for i in 1 2 3 4 5 6; do
            gh api \
              --method GET \
              "/repos/${REPO}/code-scanning/alerts?state=open&tool_name=CodeQL&ref=refs/heads/${REF_NAME}&per_page=100" \
              > "$alerts_json"

            count="$(jq 'length' "$alerts_json")"
            if [ "$count" -gt 0 ]; then
              break
            fi

            if [ "$i" -lt 6 ]; then
              sleep 30
            fi
          done

          count="$(jq 'length' "$alerts_json")"
          echo "count=$count" >> "$GITHUB_OUTPUT"

      - name: Stop when there are no findings
        if: ${{ steps.findings.outputs.count == '0' }}
        run: echo "No open CodeQL findings for this ref."

      - name: Generate findings report
        if: ${{ steps.findings.outputs.count != '0' }}
        env:
          ALERT_COUNT: ${{ steps.findings.outputs.count }}
          REF_NAME: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail

          jq -r '
            ["# Security Scan Findings", "", "Open CodeQL alerts: " + (length|tostring), "", "| Rule | Severity | File | Alert |", "|---|---|---|---|"],
            (.[] | "| " + .rule.id + " | " + (.rule.severity // "n/a") + " | " + (.most_recent_instance.location.path // "n/a") + " | " + .html_url + " |")
          ' security/codeql-alerts.json > security/security-scan-report.md

          {
            echo ""
            echo "Scanned ref: \\`${REF_NAME}\\`"
            echo "Commit: \\`${SHA}\\`"
          } >> security/security-scan-report.md

      - name: Commit findings report
        if: ${{ steps.findings.outputs.count != '0' }}
        env:
          REF_NAME: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git checkout -B security/auto-fix
          git add security/codeql-alerts.json security/security-scan-report.md

          if git diff --cached --quiet; then
            echo "No report changes to commit."
            exit 0
          fi

          git commit -m "chore(security): update CodeQL findings report"
          git push --force-with-lease origin security/auto-fix

      - name: Create or update pull request
        if: ${{ steps.findings.outputs.count != '0' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          BASE_REF: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail

          existing_pr="$(gh pr list --repo "$REPO" --head security/auto-fix --base "$BASE_REF" --state open --json number --jq '.[0].number')"

          body_file="security/security-scan-report.md"
          if [ -n "$existing_pr" ] && [ "$existing_pr" != "null" ]; then
            gh pr edit "$existing_pr" \
              --repo "$REPO" \
              --title "Security Scan Findings" \
              --body-file "$body_file"
          else
            gh pr create \
              --repo "$REPO" \
              --base "$BASE_REF" \
              --head security/auto-fix \
              --title "Security Scan Findings" \
              --body-file "$body_file"
          fi
