name: Security Scan and Auto PR

on:
  push:
  pull_request:
  schedule:
    - cron: '17 3 * * 1'

permissions:
  contents: write
  pull-requests: write
  security-events: write

jobs:
  security-scan:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: c-cpp
          build-mode: none

      - name: Analyze with CodeQL
        uses: github/codeql-action/analyze@v4
        with:
          output: codeql-results
          upload: always

      - name: Upload SARIF artifact
        uses: actions/upload-artifact@v4
        with:
          name: codeql-sarif
          path: codeql-results
          if-no-files-found: error

      - name: Evaluate findings and create report files
        id: evaluate
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p security-reports

          mapfile -t SARIF_FILES < <(find codeql-results -type f -name '*.sarif' | sort)

          if [ "${#SARIF_FILES[@]}" -eq 0 ]; then
            echo "finding_count=0" >> "$GITHUB_OUTPUT"
            echo "No SARIF files found." > security-reports/codeql-findings.md
            {
              echo "# Security Scan Findings"
              echo
              echo "No SARIF files were generated by CodeQL."
            } > security-reports/pr-body.md
            exit 0
          fi

          cp "${SARIF_FILES[@]}" security-reports/

          FINDING_COUNT="$(jq -s '[.[].runs[]?.results[]?] | length' "${SARIF_FILES[@]}")"
          echo "finding_count=$FINDING_COUNT" >> "$GITHUB_OUTPUT"

          {
            echo "# Security Scan Findings"
            echo
            echo "Total findings: $FINDING_COUNT"
            echo
            echo "Generated at: $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          } > security-reports/codeql-findings.md

          {
            echo "# Automated Security Scan Report"
            echo
            echo "CodeQL findings detected: $FINDING_COUNT"
            echo
            echo "This PR was generated automatically because the scan found results."
            echo
            echo "See committed files under \`security-reports/\` (SARIF + summary)."
          } > security-reports/pr-body.md

      - name: Create or update PR with findings report
        if: steps.evaluate.outputs.finding_count != '0' && github.event_name != 'pull_request'
        uses: peter-evans/create-pull-request@v7
        with:
          branch: security/auto-fix
          delete-branch: true
          commit-message: "chore(security): update CodeQL findings report"
          title: "Security Scan Findings"
          body-path: security-reports/pr-body.md
          add-paths: |
            security-reports/**
