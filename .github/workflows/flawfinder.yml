name: Flawfinder Scan

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  flawfinder:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: flawfinder_scan
        uses: david-a-wheeler/flawfinder@2.0.19
        with:
          arguments: '--sarif ./'
          output: 'flawfinder_results.sarif'
